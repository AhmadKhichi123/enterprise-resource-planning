{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="logo" aria-hidden="true">👗</div>
<h1>{{ shop_name }}</h1>
<p class="muted center">Log in to continue</p>
<form method="post" class="card">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <p><label for="u">Username</label><input id="u" name="username" autocomplete="username" required autofocus></p>
  <p><label for="p">Password</label><input id="p" type="password" name="password" autocomplete="current-password" required></p>
  <p><label class="check"><input type="checkbox" name="remember" value="1" checked> Keep me logged in on this device</label></p>
  <button class="btn primary block" type="submit">Log in</button>
</form>
<p class="muted small center">Forgot your password? Ask the owner to reset it from Settings.</p>
{% endblock %}
